name: docs

# The documentation is part of the product: it is what an agent reads before it
# writes code. This job makes the drift checks run without a human remembering
# to. It is deliberately dependency-free - the checker is stdlib Python.

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: every job here reads the tree and nothing else.
permissions:
  contents: read

concurrency:
  # A newer push or an updated pull request supersedes the run it replaces. Both
  # workflows only read, so cancelling is always safe; `main` is left alone so the
  # log for a merged commit still exists when someone goes looking for it.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          # The coverage gate below derives its baseline from commit 4290e68, so
          # this job needs the history the default shallow clone drops.
          fetch-depth: 0

      - name: Documentation drift and the ONNX Runtime pin
        # check-docs.py includes the pin: one field in the composite action both
        # workflows call, failed when a document that names a release path keeps
        # naming the old version - the half of a bump nobody remembers. The
        # self-test runs first: the inventory rules are newer than the tree they
        # check, and a rule that rejects correct prose is worse here than a rule
        # that misses - so both the broken and the clean synthetic tree are read.
        run: |
          python3 tools/check-docs.py --selftest
          python3 tools/check-docs.py

      - name: Documentation coverage gate
        # Every distinctive word of the corpus as it stood at 4290e68 - the last
        # commit before the move into references/ - must still occur somewhere in
        # the tree; a dropped paragraph takes its rare words with it. The baseline
        # is derived from that commit rather than checked in, so there is nothing
        # to regenerate when the prose moves.
        run: |
          python3 tools/coverage-check.py baseline
          python3 tools/coverage-check.py check

      - name: Tool self-tests
        # Both are a tool's own check, both cost a second, and neither needs
        # binutils, a compiler or a harness: the first feeds a canned readelf and
        # fails when the version comparison stops refusing a bound that is one
        # step too low, the second hashes the committed model and reads the JSON
        # beside it, so a model replaced without re-measuring cannot pass.
        # run-tests.sh runs the same two, for the runs that never reach CI.
        run: |
          bash tools/check-glibc.sh --max 2.17 --selftest
          tools/measure-halo.sh templates/onnx-inference-ofx/models/test_conv.onnx --check

      - name: Script syntax
        run: |
          python3 -m py_compile tools/*.py tests/resolve/*.py
          bash -n run-tests.sh
          bash -n templates/minimal-ofx/build.sh
          bash -n templates/minimal-ofx/test/run-tests.sh
          bash -n templates/minimal-cuda-ofx/build.sh
          bash -n templates/onnx-inference-ofx/build.sh

      - name: Action pins and workflow shape
        # The half that needs no download, so it runs before the actionlint fetch:
        # every `uses:` names a 40-character commit and a version comment, and the
        # faults a YAML error leaves behind (tab indentation, a value that opens a
        # quote or a bracket without closing it, a key twice in one mapping, a
        # block scalar at its key's column, a job with no runs-on or both runs-on
        # and uses) are reported here. Ten fixtures prove each of them fails, the
        # clean one has to pass.
        # run-tests.sh runs the same two commands on the way to a push.
        run: |
          python3 tools/check-workflows.py --selftest
          python3 tools/check-workflows.py

      - name: Workflow syntax
        # A syntax error in these files surfaces only when a job starts, which is
        # the one moment nobody is watching. actionlint reads the workflow against
        # GitHub's schema and the shell inside every `run:` too. Pinned by version
        # and by the digest of the tarball, so the checker cannot change under a
        # green tick.
        shell: bash
        run: |
          set -euo pipefail
          version=1.7.7
          curl -fsSL -o /tmp/actionlint.tgz \
            "https://github.com/rhysd/actionlint/releases/download/v${version}/actionlint_${version}_linux_amd64.tar.gz"
          echo "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  /tmp/actionlint.tgz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tgz -C /tmp actionlint
          /tmp/actionlint .github/workflows/*.yml
