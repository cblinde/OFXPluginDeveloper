name: docs

# The documentation is part of the product: it is what an agent reads before it
# writes code. This job makes the drift checks run without a human remembering
# to. It is deliberately dependency-free - the checker is stdlib Python.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The coverage gate below derives its baseline from commit 4290e68, so
          # this job needs the history the default shallow clone drops.
          fetch-depth: 0

      - name: Documentation drift
        run: python3 tools/check-docs.py

      - name: Documentation coverage gate
        # Every distinctive word of the corpus as it stood at 4290e68 - the last
        # commit before the move into references/ - must still occur somewhere in
        # the tree; a dropped paragraph takes its rare words with it. The baseline
        # is derived from that commit rather than checked in, so there is nothing
        # to regenerate when the prose moves.
        run: |
          python3 tools/coverage-check.py baseline
          python3 tools/coverage-check.py check

      - name: Tool self-tests
        # Both are a tool's own check, both cost a second, and neither needs
        # binutils, a compiler or a harness: the first feeds a canned readelf and
        # fails when the version comparison stops refusing a bound that is one
        # step too low, the second hashes the committed model and reads the JSON
        # beside it, so a model replaced without re-measuring cannot pass.
        # run-tests.sh runs the same two, for the runs that never reach CI.
        run: |
          bash tools/check-glibc.sh --max 2.17 --selftest
          tools/measure-halo.sh templates/onnx-inference-ofx/models/test_conv.onnx --check

      - name: Script syntax
        run: |
          python3 -m py_compile tools/*.py tests/resolve/*.py
          bash -n run-tests.sh
          bash -n templates/minimal-ofx/build.sh
          bash -n templates/minimal-ofx/test/run-tests.sh
          bash -n templates/minimal-cuda-ofx/build.sh
          bash -n templates/onnx-inference-ofx/build.sh

  templates:
    # The suites were runnable only on the author's machine, which is how a
    # release can pass review with a broken template. CPU_ONLY builds the CUDA
    # template through its shim, and ONNX Runtime is installed below so the
    # inference template is built and tested rather than skipped by name - the
    # run-tests.sh summary fails any CI run that skips it anyway.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ONNX Runtime
        # Without this the ONNX template is skipped by name, which is how its
        # Windows build stayed broken while the run stayed green. The package is
        # the same one the docs point at, unpacked into the release layout the
        # template expects (include/ + lib/).
        #
        # The unpack lives in .github/actions/onnx-runtime because the linux
        # workflow needs the same tree; two copies of it would drift, and the
        # version has to be the one the documents name.
        uses: ./.github/actions/onnx-runtime

      - name: Runtime API floor
        # The suite below builds the template, so a runtime whose header lacks an
        # entry point the source calls fails there as a compile error. This step
        # says *which* thing is too old, in one line, and catches the quieter
        # case: a download URL that slides back to a runtime the template no
        # longer targets. 18 is the floor the source needs (the TF32 switch), not
        # the version this job uses (1.32.0).
        run: python3 tools/check-runtime.py "$ONNXRUNTIME_ROOT" --require-api 18

      - name: Test fixture self-test
        # Generating the fixtures and loading them back through ONNX Runtime is a
        # test of the tool: a fixture that stopped matching what the tiling code
        # expects fails here rather than in a host. run-tests.sh runs the same
        # stage and names it skipped when these packages are absent, so this step
        # is what keeps it from being skipped in CI.
        run: |
          python3 -m pip install --quiet --disable-pip-version-check onnx onnxruntime numpy
          python3 tools/make-testmodels.py --out build/test-fixtures

      - name: Template suites
        env:
          CPU_ONLY: "1"
          RUN_VALGRIND: "0"
          # ONNXRUNTIME_ROOT comes from the step above; without it this run now
          # fails instead of skipping the inference template.
        run: ./run-tests.sh

      - name: Negative controls
        run: ./testkit/run-negative-controls.sh
