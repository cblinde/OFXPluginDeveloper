name: windows

# The MSVC half of this repository: build.bat, the .bat suites, the contract
# harness, the ONNX template's CPU session, and a CUDA toolkit so that the
# CUDA template is compiled by nvcc here instead of only through its CPU shim.
# No step needs a device, and windows-latest has none - so the GPU rows are not
# silently skipped, the last step says they are not run.
#
# What this job cannot prove, and must not be read as proving: that a CUDA
# kernel ran, any host render, the sanitizer builds (clang-cl ASan is not
# wired), or valgrind (Linux only). Those keep their own rows and evidence.
#
# Before the first CI run this file was checked locally on 2026-11-26: actionlint
# 1.7.12 clean, and the steps as they stood that day run as written - the three
# builds and three suites (reference, CUDA through its CPU shim, inference), the
# negative controls and the two tool steps, exit 0 each. The log is
# evidence/2026-11-26-windows/windows-job-local.log, and it says where this
# machine differs from a runner (MSVC 14.50, Python 3.10.6, no 3.12).
#
# The job has grown since that run: it builds all four templates (the CUDA one
# twice, once through the shim and once under nvcc) and runs four suites. Two
# steps were added afterwards and were not part of that transcript. The OpenCL
# step's suite ran on this machine
# (evidence/2026-11-26-windows/opencl-suite.log) and its `call`/errorlevel shape
# was measured with a stub that exits 0/1/2/3, but the step itself has not been
# replayed as a workflow step; the nvcc step on 2026-11-27 has its own re-run
# record, evidence/2026-11-27-windows/windows-nvcc-step-local.log.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  suites:
    runs-on: windows-latest
    env:
      # The first CUDA step builds through the template's CPU shim; the nvcc
      # step clears this per invocation, so a shim build that silently needed a
      # toolkit would still fail that step's artifact check.
      CPU_ONLY: "1"
      # Valgrind does not exist on Windows; the .bat suites say so instead.
      RUN_VALGRIND: "0"
    steps:
      # Pinned by commit, like the other workflows here: a tag can be moved, and a
      # moved tag would run different code than the run before it.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: ONNX Runtime
        # Same action and same version default as the Linux job, so a bump is one
        # field in one file. Windows unpacks include/ + lib/ + bin/.
        uses: ./.github/actions/onnx-runtime
        with:
          platform: win-x64

      - name: Documentation and tool self-checks
        shell: bash
        run: |
          set -euo pipefail
          python tools/check-docs.py
          python tools/check-runtime.py "$ONNXRUNTIME_ROOT" --require-api 18
          python tools/check-runtime.py --self-test

      - name: Reference template
        shell: cmd
        run: |
          templates\minimal-ofx\build.bat || exit /b 1
          templates\minimal-ofx\test\run-tests.bat Release nobuild || exit /b 1

      - name: CUDA template through its CPU path
        shell: cmd
        run: |
          templates\minimal-cuda-ofx\build.bat || exit /b 1
          templates\minimal-cuda-ofx\test\run-tests.bat Release nobuild || exit /b 1

      - name: CUDA toolkit
        # windows-latest ships no CUDA toolkit, which is why the step above only
        # reaches the CPU shim. `network` fetches the sub-packages named here
        # instead of the ~3 GB local installer. The names are NVIDIA's own, from
        # the installation guide's subpackage table ("Subpackage names use the
        # format <component>_<major>.<minor>"); this action appends the version
        # itself, so a bare name is what goes in the list.
        #
        #   nvcc       compiles Kernel.cu
        #   cudart     cuda_runtime.h and cudart.lib, which the plug-in links
        #   cuobjdump  its own subpackage, not part of nvcc, and the step below
        #              needs it: check-ofx-artifact.bat --cuda --strict exits 3
        #              with "cuobjdump not found" without it
        #
        # No `visual_studio_integration` (Ninja reaches the .cu through nvcc
        # directly) and no `crt`/`nvvm` unless the preflight below says so: no
        # separable compilation here, and the kernel uses no libdevice maths.
        # Pinned by commit like every other action in this tree.
        uses: Jimver/cuda-toolkit@b8bf9c6c28f8a92fbb04dcfcaee872e60c57462d  # v0.2.36
        with:
          cuda: "12.9.1"
          method: network
          sub-packages: '["nvcc", "cudart", "cuobjdump"]'

      - name: The CUDA sub-packages arrived
        # A component that was never installed and a name that does not exist
        # look the same three steps later: nvcc compiles, then the artifact
        # check cannot find cuobjdump, and the log blames the plug-in. So each
        # artefact the build actually uses is checked here and named with the
        # subpackage that provides it, so a partial toolkit stops before the
        # configure instead of inside it.
        #
        # No smoke compile: nvcc refuses to run without cl.exe, and the vcvars
        # call that provides it belongs to build.bat. The first compile is the
        # real one; if it fails naming libdevice, the missing subpackage is
        # `nvvm`, and that is the one line this step cannot check.
        shell: cmd
        run: |
          set "FAIL=0"
          set "ROOT=%CUDA_PATH%"
          if not defined ROOT for /f "delims=" %%D in ('where nvcc 2^>nul') do if not defined ROOT set "ROOT=%%~dpD.."
          where nvcc >nul 2>&1 || (echo ::error::nvcc.exe not found - add "nvcc" to sub-packages& set FAIL=1)
          where cuobjdump >nul 2>&1 || (echo ::error::cuobjdump.exe not found - add "cuobjdump" to sub-packages& set FAIL=1)
          if not exist "%ROOT%\include\cuda_runtime.h" (echo ::error::cuda_runtime.h not found - add "cudart" to sub-packages& set FAIL=1)
          if not exist "%ROOT%\lib\x64\cudart.lib" (echo ::error::cudart.lib not found - add "cudart" to sub-packages& set FAIL=1)
          if "%FAIL%"=="1" exit /b 1
          nvcc --version
          cuobjdump --version
          echo CUDA sub-packages ok: nvcc, cudart, cuobjdump

      - name: CUDA template compiled with nvcc
        # What this step proves: MSVC plus the toolkit's nvcc compile the
        # template's CUDA path - Kernel.cu through CMake's CUDA language - and the
        # .ofx that comes out carries device code, which check-ofx-artifact.bat
        # --cuda reads back with cuobjdump (SASS for the architectures this
        # toolkit targets). CPU_ONLY is empty on purpose: build.bat then stops by
        # name when no toolkit is found, instead of quietly building the shim
        # again and letting this step pass on the wrong binary.
        #
        # What it does not prove: that any kernel runs. The runner has no GPU, so
        # test\gpu-kernel-test.cu is never executed here and nothing in this job is
        # throughput, bit-exactness or host behaviour; those keep the row that ran
        # on the RTX 3060 (evidence/2026-11-24-windows). This step is a compile and
        # an artifact check, and no more.
        #
        # Ninja and a fresh build directory: the CPU step above configured build\
        # with the Visual Studio generator, CMake refuses to reuse that directory
        # under another generator, and the CUDA build pins the MSVC toolset through
        # `vcvars64 -vcvars_ver` - which only the Ninja path can do.
        env:
          CPU_ONLY: ""
          CMAKE_GENERATOR: Ninja
        shell: cmd
        run: |
          rmdir /s /q templates\minimal-cuda-ofx\build 2>nul
          where ninja >nul 2>&1 || python -m pip install --quiet ninja
          templates\minimal-cuda-ofx\build.bat || exit /b 1
          testkit\check-ofx-artifact.bat templates\minimal-cuda-ofx\build\bundle\MinimalCudaGain.ofx.bundle\Contents\Win64\MinimalCudaGain.ofx --cuda --strict || exit /b 1

      - name: ONNX template, CPU session
        shell: cmd
        run: templates\onnx-inference-ofx\test\test.bat Release || exit /b 1

      - name: The CUDA provider matches the host's CUDA major
        # The provider DLL names its CUDA major in its imports - cublas64_12.dll for
        # ONNX Runtime 1.20.1, cublas64_13.dll for 1.32.0 - and Resolve 21.2 ships
        # CUDA 12, refusing the mismatch at load as Error 1114 with no other word.
        # build.bat runs the same gate; it is repeated here so a job that gets the
        # bundle from a cache, or a future step that bypasses the script, still
        # fails on the pairing instead of on a host load. A bundle without a CUDA
        # provider has nothing to pair and is skipped by name.
        shell: bash
        run: |
          set -euo pipefail
          bundle=templates/onnx-inference-ofx/build/bundle/OnnxInference.ofx.bundle
          if [ -f "$bundle/Contents/Win64/onnxruntime_providers_cuda.dll" ]; then
            python tools/check-runtime.py "$bundle" --require-cuda-major 12
          else
            echo "no CUDA provider in $bundle, so the CUDA-major gate does not apply"
          fi

      - name: OpenCL template, CPU path and the device suite if there is one
        # The fourth template, and the one step here that may legitimately do no
        # device work: `run-tests.bat` exits 2 when the runner has no OpenCL
        # device, and a runner without one still has to compile and load the
        # bundle. Exit 2 becomes a notice, everything else is the verdict - the
        # same contract `run-tests.sh` applies on the Linux side.
        # No `nobuild` here: this template's Windows script builds in its first
        # stage, unlike the reference and CUDA steps above, which build first and
        # then call their suite with `nobuild`. (The inference step also builds in
        # its own script, stage [1/5].) So this one is called the way its header
        # documents and the exit code is read from that one run.
        #
        # `call`, and the code read in ranges, because neither is optional here.
        # A batch file invoked by name without `call` transfers control instead of
        # returning: the rest of this block never runs and the script's exit code
        # becomes the step's, so an exit 2 failed the job with no notice at all.
        # Measured on Windows with a stub that exits 0/1/2/3: that shape gave
        # 0/1/2/3 and printed nothing; with `call` the code is readable, but
        # `if errorlevel 2` alone is true for 3 as well, which is a suite failure
        # (run-tests.sh maps exactly 2 to NOT RUN and everything else to FAILED).
        # So: high to low, exactly the mapping the POSIX gate uses.
        shell: cmd
        run: |
          call templates\minimal-opencl-ofx\test\run-tests.bat Release
          if errorlevel 3 exit /b 1
          if errorlevel 2 (
            echo ::notice title=No OpenCL device on this runner::the CPU path and the artifact check passed; the OpenCL suite needs a device and this job does not claim one.
            exit /b 0
          )
          if errorlevel 1 exit /b 1

      - name: Negative controls
        shell: cmd
        run: testkit\run-negative-controls.bat || exit /b 1

      - name: GPU rows are not run in this job
        shell: bash
        run: |
          echo "::notice title=No GPU on windows-latest::the CUDA kernel suite, the CUDA execution provider suite and every host render keep their own evidence rows; this job proves the MSVC and nvcc compiles, the contract harness and the CPU paths only - it ran no kernel and loaded no host."
