name: windows

# The MSVC half of this repository: build.bat, the .bat suites, the contract
# harness and the ONNX template's CPU session. None of it needs a device, and
# windows-latest has none - so the GPU rows are not silently skipped here, the
# last step says they are not run.
#
# What this job cannot prove, and must not be read as proving: any CUDA kernel
# on a GPU, any host render, the sanitizer builds (clang-cl ASan is not wired),
# or valgrind (Linux only). Those keep their own rows and their own evidence.
#
# Before the first CI run this file was checked locally on 2026-11-26: actionlint
# 1.7.12 clean, and every step below run as written - the three builds, all three
# suites, the negative controls and the two tool steps, exit 0 each. The log is
# evidence/2026-11-26-windows/windows-job-local.log, and it says where this
# machine differs from a runner (MSVC 14.50, Python 3.10.6, no 3.12).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  suites:
    runs-on: windows-latest
    env:
      # The CUDA template builds through its CPU shim: no toolkit on the runner,
      # and a bundle that silently needed one would fail the artifact check.
      CPU_ONLY: "1"
      # Valgrind does not exist on Windows; the .bat suites say so instead.
      RUN_VALGRIND: "0"
    steps:
      # Pinned by commit, like the other workflows here: a tag can be moved, and a
      # moved tag would run different code than the run before it.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: ONNX Runtime
        # Same action and same version default as the Linux job, so a bump is one
        # field in one file. Windows unpacks include/ + lib/ + bin/.
        uses: ./.github/actions/onnx-runtime
        with:
          platform: win-x64

      - name: Documentation and tool self-checks
        shell: bash
        run: |
          set -euo pipefail
          python tools/check-docs.py
          python tools/check-runtime.py "$ONNXRUNTIME_ROOT" --require-api 18
          python tools/check-runtime.py --self-test

      - name: Reference template
        shell: cmd
        run: |
          templates\minimal-ofx\build.bat || exit /b 1
          templates\minimal-ofx\test\run-tests.bat Release nobuild || exit /b 1

      - name: CUDA template through its CPU path
        shell: cmd
        run: |
          templates\minimal-cuda-ofx\build.bat || exit /b 1
          templates\minimal-cuda-ofx\test\run-tests.bat Release nobuild || exit /b 1

      - name: ONNX template, CPU session
        shell: cmd
        run: templates\onnx-inference-ofx\test\test.bat Release || exit /b 1

      - name: OpenCL template, CPU path and the device suite if there is one
        # The fourth template, and the one step here that may legitimately do no
        # device work: `run-tests.bat` exits 2 when the runner has no OpenCL
        # device, and a runner without one still has to compile and load the
        # bundle. Exit 2 becomes a notice, everything else is the verdict - the
        # same contract `run-tests.sh` applies on the Linux side.
        # No `nobuild` here: this template's Windows script builds in its first
        # stage (unlike the other three), so it is called the way its own header
        # documents and the exit code is read from that one run.
        shell: cmd
        run: |
          templates\minimal-opencl-ofx\test\run-tests.bat Release && exit /b 0
          if errorlevel 2 (
            echo ::notice title=No OpenCL device on this runner::the CPU path and the artifact check passed; the OpenCL suite needs a device and this job does not claim one.
            exit /b 0
          )
          exit /b 1

      - name: Negative controls
        shell: cmd
        run: testkit\run-negative-controls.bat || exit /b 1

      - name: GPU rows are not run in this job
        shell: bash
        run: |
          echo "::notice title=No GPU on windows-latest::the CUDA kernel suite, the CUDA execution provider suite and every host render keep their own evidence rows; this job proves the MSVC build, the contract harness and the CPU paths only."
